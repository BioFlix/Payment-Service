apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-postgres
  labels:
    app: bioflix
    service: payment-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate   # single DB pod holding a volume: stop the old one before starting the new one
  selector:
    matchLabels:
      service: payment-postgres
  template:
    metadata:
      labels:
        app: bioflix
        service: payment-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            # The tables are created by payment-service itself (Flyway) – only the empty database is made here
            - name: POSTGRES_DB
              value: payments_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "payments_db"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: payment-postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-postgres-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
